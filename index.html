<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重庆中小学教材版本查询</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --mute:#6b7280; --line:#e5e7eb;
    --brand:#1f6feb; --ok:#0f7b3e; --warn:#a35b00; --warnbg:#fff5e6;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#111417;--card:#181c21;--ink:#e8eaed;--mute:#9aa3ad;--line:#2a3038;--brand:#5b9dff;
          --ok:#4ade80;--warn:#fbbf24;--warnbg:#2a2113;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Heiti SC",sans-serif;}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--mute);font-size:13px;margin-bottom:20px}
  .search{position:sticky;top:0;background:var(--bg);padding:8px 0 14px;z-index:5}
  input{width:100%;padding:14px 16px;font-size:17px;border:1px solid var(--line);
        border-radius:12px;background:var(--card);color:var(--ink);outline:none}
  input:focus{border-color:var(--brand)}
  .hint{color:var(--mute);font-size:13px;margin:8px 2px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .item:hover{border-color:var(--brand)}
  .name{font-weight:600;font-size:16px}
  .meta{color:var(--mute);font-size:13px;margin-top:3px}
  .tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  .tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  .tbl th{color:var(--mute);font-weight:500;font-size:13px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;
       border:1px solid var(--line);color:var(--mute);margin-left:6px}
  .tag.ok{color:var(--ok);border-color:var(--ok)}
  .tag.warn{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
  .seg{margin-top:14px}
  .seg h3{font-size:14px;margin:0 0 4px;color:var(--mute);font-weight:600}
  .empty{color:var(--mute);padding:40px 0;text-align:center}
  .note{margin-top:26px;padding:14px 16px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;font-size:13px;color:var(--mute)}
  .note b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>重庆中小学教材版本查询</h1>
  <div class="sub" id="sub"></div>
  <div class="search"><input id="q" placeholder="输入学校名，比如「巴蜀」「八中」「人民小学」" autocomplete="off"></div>
  <div id="list"></div>
  <div class="note">
    <b>怎么用</b>：输几个字就行，不用打全称。<br><br>
    <b>版本怎么来的</b>：教材由<b>区县教委统一选用</b>，不是每所学校自己定。所以查到学校后，看它所在区县的版本表。
    带 <span class="tag ok">官方</span> 的来自区教委公示文件；带 <span class="tag warn">推定</span> 的，是该区县没有公开版本表，按同片区推断的。<br><br>
    <b>注意</b>：① 少数区县同一学科有多个版本并存（如两江新区部分学校用不同版本），表里会显示多个；
    ② 同名学校常有多个校区，以区县和地址区分，教材版本跟着校区所在区县走；
    ③ 民办学校的校本教材不属国标教材范围，未收录。
  </div>
</div>

const S = DATA.schools, V = DATA.versions;
document.getElementById('sub').textContent =
  `已收录 ${S.length} 所学校 · ${Object.keys(V).length} 个区县 · 数据截至 2026 年秋季`;

const list = document.getElementById('list');
const q = document.getElementById('q');

function render(list_) {
  if (!list_.length) { list.innerHTML = '<div class="empty">没找到，换个关键词试试（可以只打两个字）</div>'; return; }
  list.innerHTML = list_.slice(0, 40).map((s, i) => card(s, i)).join('');
}
function stagesFor(s) {
  const st = s.s || '';
  if (st.includes('十二')) return ['小学','初中','高中'];
  if (st.includes('九年') || st.includes('一贯')) return ['小学','初中'];
  if (st.includes('完全中学')) return ['初中','高中'];
  if (st === '中学') return ['初中','高中'];
  if (st.includes('高中')) return ['高中'];
  if (st.includes('初中')) return ['初中'];
  if (st.includes('小学')) return ['小学'];
  return ['小学','初中','高中'];
}
function card(s, i) {
  const v = V[s.d] || {};
  const rows = stagesFor(s).filter(seg => v[seg] && Object.keys(v[seg]).length)
    .map(seg => {
      const subs = Object.entries(v[seg]);
      return `<div class="seg"><h3>${seg}</h3><table class="tbl">
        <tr><th style="width:42%">学科</th><th>教材版本</th><th style="width:64px">来源</th></tr>
        ${subs.map(([k, o]) => `<tr><td>${k}</td><td>${o.p}</td>
          <td>${o.r ? '<span class="tag ok">官方</span>' : '<span class="tag warn">推定</span>'}</td></tr>`).join('')}
      </table></div>`;
    }).join('');
  return `<div class="item" onclick="this.dataset.o=this.dataset.o?'' :'1'; this.querySelector('.body').style.display=this.dataset.o?'block':'none'">
    <div class="name">${s.n}</div>
    <div class="meta">${[s.d, s.s, s.t, s.a].filter(Boolean).join(' · ')}</div>
    <div class="body" style="display:none">${rows || '<div class="meta">该区县版本表缺</div>'}</div>
  </div>`;
}
function search(kw) {
  kw = (kw || '').trim();
  if (!kw) { list.innerHTML = '<div class="empty">输几个字开始查</div>'; return; }
  const hits = S.filter(s => s.n.includes(kw) || s.d.includes(kw));
  // 学校名精确度排序：以关键词开头的优先
  hits.sort((a, b) => (b.n.startsWith(kw) ? 1 : 0) - (a.n.startsWith(kw) ? 1 : 0) || a.n.length - b.n.length);
  render(hits);
}
q.addEventListener('input', e => search(e.target.value));
list.innerHTML = '<div class="empty">输几个字开始查</div>';
